# Apache site for the Unitas webshop. Installed as /etc/apache2/sites-available/unitas.conf.
#  - port 80  : only redirects to HTTPS
#  - port 443 : HTTPS, passes visitors on to the website (Kestrel on 127.0.0.1:5000)

<VirtualHost *:80>
    ServerName 172.20.66.40
    Redirect permanent / https://172.20.66.40/
</VirtualHost>

<VirtualHost *:443>
    ServerName 172.20.66.40

    SSLEngine on
    SSLCertificateFile    /etc/ssl/unitas/unitas.crt
    SSLCertificateKeyFile /etc/ssl/unitas/unitas.key
    # Only modern TLS versions
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    # mod_proxy adds X-Forwarded-For (visitor IP) itself; tell the app the visitor used HTTPS,
    # so it marks its cookies "Secure" (only sent over HTTPS).
    RequestHeader set X-Forwarded-Proto "https"

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/unitas-error.log
    CustomLog ${APACHE_LOG_DIR}/unitas-access.log combined
</VirtualHost>
